name: Release

# Cut a release by pushing a version tag:
#   git tag v2.0.0 && git push origin v2.0.0
# The tag must match the version in package.json.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish VSIX
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check tag matches package.json version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION" >&2
            exit 1
          fi
          echo "VSIX=llm-copilot-${PKG_VERSION}.vsix" >> "$GITHUB_ENV"

      - name: Test
        run: npm test

      - name: Package VSIX
        run: npx --yes @vscode/vsce package --no-dependencies --out "$VSIX"
        env:
          NODE_NO_WARNINGS: '1'

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<EOF
          ### Install

          Download \`$VSIX\` below, then either:

          - **VS Code UI** — Extensions view → \`...\` menu → *Install from VSIX...*
          - **Command line** — \`code --install-extension $VSIX\`

          Reload VS Code afterwards. Configure a provider under Settings → LLM Copilot;
          see the [README](https://github.com/RA-King/llm-copilot#readme) for per-provider setup.
          EOF

          gh release create "$GITHUB_REF_NAME" "$VSIX" \
            --title "LLM Copilot $GITHUB_REF_NAME" \
            --notes-file notes.md \
            --generate-notes
